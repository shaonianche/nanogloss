<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    A gloss: a note written against one word of a line. A white speech bubble carries the note,
    and its tail points down at the word it explains, drawn as a single bar at the bottom.

    Three shapes only, so the silhouette survives the 16 px toolbar size. The tile is HeroUI's
    accent (oklch 0.62 0.195 253.83 ≈ #0485F7), solid so its edge holds on light and dark
    toolbars, and the bubble is the color of the in-page bubble the icon opens.
  -->
  <rect width="128" height="128" rx="28" fill="#0485F7"/>

  <!-- The note, with its tail pointing at the word below. -->
  <path d="M38 18h52a18 18 0 0 1 18 18v20a18 18 0 0 1-18 18H62l-16 16V74h-8a18 18 0 0 1-18-18V36a18 18 0 0 1 18-18z" fill="#FFFFFF"/>
  <rect x="36" y="34" width="56" height="11" rx="5.5" fill="#0485F7"/>
  <rect x="36" y="51" width="34" height="11" rx="5.5" fill="#0485F7" fill-opacity="0.45"/>

  <!-- The glossed word. -->
  <rect x="20" y="98" width="88" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="34" y="98" width="34" height="12" rx="6" fill="#FFFFFF"/>
</svg>
